<div class="panel px-6 py-16 text-center">
  <div
    class="mx-auto flex h-11 w-11 items-center justify-center rounded-full bg-danger/10 text-danger"
    aria-hidden="true"
  >
    <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
      <path
        fill-rule="evenodd"
        d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
        clip-rule="evenodd"
      />
    </svg>
  </div>
  <h2 class="mt-4 text-base font-semibold text-ink">Something went wrong</h2>
  <p class="mt-1 mb-6 text-sm text-muted" role="alert">{{ message() }}</p>
  <button (click)="retry.emit()" type="button" class="btn-primary">Retry</button>
</div>
